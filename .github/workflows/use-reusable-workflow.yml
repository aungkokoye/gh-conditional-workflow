name: Website Deployment
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Lint code
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Test code
        id: test-step
        run: npm run test
      - name: Upload test report
        if: failure() && steps.test-step.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test.json
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build website
        id: build-website
        run: npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist
  deploy:
    needs: build
    uses: ./.github/workflows/reusable-workflow.yml
    with:
      artifact-name: 'dist-files'
    secrets:
      mongo-secret-username: ${{ secrets.MONGO_USERNAME }}  
  print-deployent-outcome:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Print deployment outcome
        run: |
          echo "Deployment Result: ${{ needs.deploy.outputs.result }}"
  
  report:
    needs: [deploy, lint]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Generate report
        run: |
          echo "Generating report for all jobs..."
          echo "${{ toJson(github) }}"
