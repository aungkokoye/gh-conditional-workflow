name: Martix Workflow
on:
    push:
      branches:
        - main
        - dev
jobs:
    build:
      continue-on-error: false  
      strategy:
        matrix:
          node-version: [12, 14, 16]
          os: [ubuntu-latest, windows-latest]
          include:
            - node-version: 18
              os: ubuntu-latest
          exclude:
            - node-version: 12
              os: windows-latest
      runs-on: ${{ matrix.os }}
      steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Setup Node
          uses: actions/setup-node@v3
          with:
            node-version: ${{ matrix.node-version }}
        - name: Install dependencies
          run: npm ci
        - name: Run build
          run: npm run build
        - name: Run tests
          run: npm test 
        - name: Deploy
          run: echo "Deploying application..."

